{% extends "base.html" %}

{% block title %}
Create Post - MyBlog
{% endblock %}


{% block content %}

<div class="form-page">

    <div class="form-card">

        <div class="form-header">

            <h1>
                Create a New Post
            </h1>

            <p>
                Share your thoughts, stories, pictures and videos.
            </p>

        </div>


        <form
            method="POST"
            enctype="multipart/form-data"
            class="post-form"
        >


            <label>
                Title
            </label>

            <input
                type="text"
                name="title"
                placeholder="Enter your post title"
                required
            >


            <label>
                Category
            </label>

            <select name="category">

                <option value="">
                    Select a category
                </option>

                <option value="Technology">
                    Technology
                </option>

                <option value="Education">
                    Education
                </option>

                <option value="Psychology">
                    Psychology
                </option>

                <option value="Lifestyle">
                    Lifestyle
                </option>

                <option value="Entertainment">
                    Entertainment
                </option>

                <option value="News">
                    News
                </option>

                <option value="Personal">
                    Personal
                </option>

                <option value="Other">
                    Other
                </option>

            </select>


            <label>
                Content
            </label>

            <textarea
                name="content"
                rows="10"
                placeholder="Write your story..."
                required
            ></textarea>


            <div class="upload-section">

                <h3>
                    📷 Add Images
                </h3>

                <p>
                    You can select multiple images.
                </p>

                <input
                    type="file"
                    name="images"
                    accept="image/*"
                    multiple
                >

            </div>


            <div class="upload-section">

                <h3>
                    🎥 Add Video
                </h3>

                <p>
                    MP4, WebM, OGG or MOV.
                </p>

                <input
                    type="file"
                    name="video"
                    accept="video/*"
                >

            </div>


            <button
                type="submit"
                class="submit-button"
            >
                🚀 Publish Post
            </button>


        </form>

    </div>

</div>

{% endblock %}
