{% extends "base.html" %}

{% block title %}
Register - MyBlog
{% endblock %}


{% block content %}

<div class="auth-container">

    <div class="auth-card">

        <div class="auth-icon">
            🚀
        </div>

        <h1>
            Create Account
        </h1>

        <p>
            Join the MyBlog community.
        </p>


        <form
            method="POST"
            class="auth-form"
        >

            <label>
                Username
            </label>

            <input
                type="text"
                name="username"
                placeholder="Choose a username"
                required
            >


            <label>
                Password
            </label>

            <input
                type="password"
                name="password"
                placeholder="Create a password"
                required
            >


            <button type="submit">
                Create Account
            </button>

        </form>


        <p class="auth-footer">

            Already have an account?

            <a href="{{ url_for('login') }}">
                Login
            </a>

        </p>

    </div>

</div>

{% endblock %}
