{% extends "base.html" %}

{% block title %}Login - MyBlog{% endblock %}

{% block content %}

<div class="auth-page">

    <div class="auth-card">

        <div class="auth-logo">
            <div class="auth-logo-icon">✦</div>
            <span>MyBlog</span>
        </div>


        <div class="auth-header">

            <h1>Welcome back</h1>

            <p>
                Login to continue sharing and discovering great stories.
            </p>

        </div>


        <form
            action="{{ url_for('login') }}"
            method="POST"
            class="auth-form"
        >

            <div class="auth-form-group">

                <label for="username">
                    Username
                </label>

                <div class="auth-input-wrapper">

                    <span>👤</span>

                    <input
                        type="text"
                        id="username"
                        name="username"
                        placeholder="Enter your username"
                        autocomplete="username"
                        required
                    >

                </div>

            </div>


            <div class="auth-form-group">

                <label for="password">
                    Password
                </label>

                <div class="auth-input-wrapper">

                    <span>🔒</span>

                    <input
                        type="password"
                        id="password"
                        name="password"
                        placeholder="Enter your password"
                        autocomplete="current-password"
                        required
                    >

                    <button
                        type="button"
                        class="password-toggle"
                        onclick="togglePassword()"
                    >
                        👁️
                    </button>

                </div>

            </div>


            <button
                type="submit"
                class="auth-submit"
            >
                Login
            </button>

        </form>


        <div class="auth-divider">
            <span>New to MyBlog?</span>
        </div>


        <a
            href="{{ url_for('register') }}"
            class="auth-secondary-button"
        >
            Create an Account
        </a>


        <p class="auth-footer-text">
            Share your ideas. Discover new perspectives. Connect through stories.
        </p>

    </div>

</div>


<script>

function togglePassword() {

    const password =
        document.getElementById("password");

    if (password.type === "password") {

        password.type = "text";

    } else {

        password.type = "password";

    }

}

</script>

{% endblock %}
